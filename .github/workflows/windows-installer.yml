name: Windows installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "client-windows/**"
      - ".github/workflows/windows-installer.yml"
  push:
    branches:
      - main
    paths:
      - "client-windows/**"
      - ".github/workflows/windows-installer.yml"

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Build single EXE installer
        shell: powershell
        run: .\client-windows\build-installer.ps1 -Architecture x64 -Version "1.0.${{ github.run_number }}"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Serenada-Windows-x64
          path: client-windows/artifacts/installer/Serenada-Setup-x64.exe
          if-no-files-found: error
